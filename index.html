<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laya 聊天记录生成器</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- html2canvas -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    /* 原生移动端字体，确保繁体中文字符水平对齐且不掉字 */
    .mobile-screen {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Heiti TC", "Microsoft JhengHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    /* 锁死文字基线，杜绝上下抖动错位 */
    .baseline-fix {
      display: inline-flex;
      align-items: center;
      vertical-align: middle;
      line-height: 1;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen flex flex-col">

  <!-- 顶部导航条 (简体中文) -->
  <header class="bg-gradient-to-r from-blue-700 via-indigo-700 to-blue-800 text-white shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-white/20 backdrop-blur flex items-center justify-center font-bold text-lg border border-white/30">
          Laya
        </div>
        <div>
          <h1 class="text-base sm:text-lg font-bold leading-tight">Laya 聊天记录生成器</h1>
          <p class="text-xs text-blue-200">像素级精准对齐 · 繁体界面直出 · 高清截屏</p>
        </div>
      </div>
      <div class="flex items-center space-x-2">
        <button onclick="loadTemplate('icebreak')" class="px-3 py-1.5 text-xs bg-white/10 hover:bg-white/20 rounded-lg transition border border-white/20">
          破冰剧本
        </button>
        <button onclick="loadTemplate('dating')" class="px-3 py-1.5 text-xs bg-white/10 hover:bg-white/20 rounded-lg transition border border-white/20">
          约会剧本
        </button>
        <button onclick="takeScreenshot()" class="px-4 py-1.5 text-xs font-semibold bg-emerald-500 hover:bg-emerald-600 text-white rounded-lg transition shadow-md flex items-center gap-1.5">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
          一键导出截图
        </button>
      </div>
    </div>
  </header>

  <!-- 工作区 -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 py-6 flex-1 w-full grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
    
    <!-- 左侧控制面板 (100% 简体中文) -->
    <div class="lg:col-span-7 space-y-5">

      <!-- 资料设置 -->
      <section class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 space-y-4">
        <h2 class="text-sm font-bold text-slate-800 flex items-center gap-2 border-b pb-3">
          <span class="w-2 h-4 bg-blue-600 rounded-full"></span>
          对方与个人资料设置
        </h2>
        
        <!-- 对方头像 -->
        <div class="flex items-center gap-4">
          <img id="target-avatar-preview" src="" class="w-14 h-14 rounded-full object-cover border-2 border-blue-500 bg-slate-100 shadow-sm shrink-0" alt="头像">
          <div class="flex-1 space-y-2">
            <div class="flex flex-wrap gap-2">
              <button type="button" onclick="setTargetAvatarPreset(0)" class="px-2.5 py-1 text-xs bg-slate-100 hover:bg-blue-50 hover:text-blue-600 rounded border">甜美女神</button>
              <button type="button" onclick="setTargetAvatarPreset(1)" class="px-2.5 py-1 text-xs bg-slate-100 hover:bg-blue-50 hover:text-blue-600 rounded border">温柔系</button>
              <button type="button" onclick="setTargetAvatarPreset(2)" class="px-2.5 py-1 text-xs bg-slate-100 hover:bg-blue-50 hover:text-blue-600 rounded border">阳光女孩</button>
              <button type="button" onclick="setTargetAvatarPreset(3)" class="px-2.5 py-1 text-xs bg-slate-100 hover:bg-blue-50 hover:text-blue-600 rounded border">帅气男生</button>
            </div>
            <label class="inline-flex items-center gap-1.5 px-3 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs rounded cursor-pointer border">
              <span>📁 上传对方真实头像图片</span>
              <input type="file" accept="image/*" class="hidden" onchange="handleImageUpload(event, 'target')">
            </label>
          </div>
        </div>

        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 pt-1">
          <div>
            <label class="block text-xs text-slate-500 mb-1">昵称</label>
            <input type="text" id="cfg-name" value="柔柔" oninput="updateDisplay()" class="w-full text-xs px-2.5 py-1.5 border rounded-lg focus:ring-1 focus:ring-blue-500 outline-none">
          </div>
          <div>
            <label class="block text-xs text-slate-500 mb-1">年龄</label>
            <input type="text" id="cfg-age" value="23" oninput="updateDisplay()" class="w-full text-xs px-2.5 py-1.5 border rounded-lg focus:ring-1 focus:ring-blue-500 outline-none">
          </div>
          <div>
            <label class="block text-xs text-slate-500 mb-1">身高</label>
            <input type="text" id="cfg-height" value="165cm" oninput="updateDisplay()" class="w-full text-xs px-2.5 py-1.5 border rounded-lg focus:ring-1 focus:ring-blue-500 outline-none">
          </div>
          <div>
            <label class="block text-xs text-slate-500 mb-1">城市地区</label>
            <input type="text" id="cfg-city" value="台北市" oninput="updateDisplay()" class="w-full text-xs px-2.5 py-1.5 border rounded-lg focus:ring-1 focus:ring-blue-500 outline-none">
          </div>
        </div>

        <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
          <div>
            <label class="block text-xs text-slate-500 mb-1">星座</label>
            <input type="text" id="cfg-constellation" value="雙子座" oninput="updateDisplay()" class="w-full text-xs px-2.5 py-1.5 border rounded-lg focus:ring-1 focus:ring-blue-500 outline-none">
          </div>
          <div>
            <label class="block text-xs text-slate-500 mb-1">距离提示</label>
            <input type="text" id="cfg-distance" value="約 2.1 km" oninput="updateDisplay()" class="w-full text-xs px-2.5 py-1.5 border rounded-lg focus:ring-1 focus:ring-blue-500 outline-none">
          </div>
          <div>
            <label class="block text-xs text-slate-500 mb-1">在线状态</label>
            <select id="cfg-online" onchange="updateDisplay()" class="w-full text-xs px-2.5 py-1.5 border rounded-lg bg-white outline-none">
              <option value="true">在线 (显示绿点)</option>
              <option value="false">离线 (隐藏绿点)</option>
            </select>
          </div>
        </div>

        <!-- 我方头像 -->
        <div class="pt-3 border-t flex items-center justify-between">
          <div class="flex items-center gap-3">
            <img id="my-avatar-preview" src="" class="w-10 h-10 rounded-full object-cover border border-slate-300 shrink-0" alt="我">
            <div>
              <div class="text-xs font-semibold text-slate-700">我方头像（自己发送的气泡）</div>
              <div class="text-[11px] text-slate-400">已锁死宽度，保证长文字绝不切图</div>
            </div>
          </div>
          <div class="flex items-center gap-2">
            <button type="button" onclick="setMyAvatarPreset(0)" class="px-2 py-1 text-xs bg-slate-100 hover:bg-slate-200 rounded border">预设男神</button>
            <button type="button" onclick="setMyAvatarPreset(1)" class="px-2 py-1 text-xs bg-slate-100 hover:bg-slate-200 rounded border">酷帅型男</button>
            <label class="px-2.5 py-1 bg-blue-50 hover:bg-blue-100 text-blue-700 text-xs rounded cursor-pointer border border-blue-200">
              <span>自定义上传</span>
              <input type="file" accept="image/*" class="hidden" onchange="handleImageUpload(event, 'my')">
            </label>
          </div>
        </div>
      </section>

      <!-- 状态栏设置 -->
      <section class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 space-y-4">
        <h2 class="text-sm font-bold text-slate-800 flex items-center gap-2 border-b pb-3">
          <span class="w-2 h-4 bg-indigo-600 rounded-full"></span>
          状态栏与外观设置
        </h2>
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
          <div>
            <label class="block text-xs text-slate-500 mb-1">系统时间</label>
            <input type="text" id="status-time" value="16:04" oninput="updateDisplay()" class="w-full text-xs px-2.5 py-1.5 border rounded-lg outline-none">
          </div>
          <div>
            <label class="block text-xs text-slate-500 mb-1">手机电量 (%)</label>
            <input type="number" id="status-battery" value="86" min="1" max="100" oninput="updateDisplay()" class="w-full text-xs px-2.5 py-1.5 border rounded-lg outline-none">
          </div>
          <div>
            <label class="block text-xs text-slate-500 mb-1">网络图标</label>
            <select id="status-network" onchange="updateDisplay()" class="w-full text-xs px-2.5 py-1.5 border rounded-lg bg-white outline-none">
              <option value="5G">5G + Wi-Fi</option>
              <option value="4G">4G 数据信号</option>
              <option value="WIFI">纯 Wi-Fi 信号</option>
            </select>
          </div>
          <div>
            <label class="block text-xs text-slate-500 mb-1">VPN 标识</label>
            <select id="status-vpn" onchange="updateDisplay()" class="w-full text-xs px-2.5 py-1.5 border rounded-lg bg-white outline-none">
              <option value="show">显示 VPN</option>
              <option value="hide">隐藏 VPN</option>
            </select>
          </div>
        </div>

        <div class="flex flex-wrap items-center gap-4 text-xs text-slate-600 pt-1">
          <label class="flex items-center gap-1.5 cursor-pointer">
            <input type="checkbox" id="show-shield" checked onchange="updateDisplay()" class="rounded text-blue-600">
            <span>安全盾牌徽标</span>
          </label>
          <label class="flex items-center gap-1.5 cursor-pointer">
            <input type="checkbox" id="show-frame" onchange="updateDisplay()" class="rounded text-blue-600">
            <span>带黑色真机外壳导出 (不勾选为纯净手机截图)</span>
          </label>
        </div>
      </section>

      <!-- 消息编辑 -->
      <section class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 space-y-4">
        <div class="flex items-center justify-between border-b pb-3">
          <h2 class="text-sm font-bold text-slate-800 flex items-center gap-2">
            <span class="w-2 h-4 bg-emerald-600 rounded-full"></span>
            聊天记录编排
          </h2>
          <div class="flex items-center gap-2">
            <button onclick="appendMessage('other')" class="px-2.5 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs rounded-lg transition">
              + 对方发消息
            </button>
            <button onclick="appendMessage('me')" class="px-2.5 py-1 bg-blue-50 hover:bg-blue-100 text-blue-700 text-xs rounded-lg transition">
              + 我方发消息
            </button>
            <button onclick="appendNotice()" class="px-2.5 py-1 bg-amber-50 hover:bg-amber-100 text-amber-700 text-xs rounded-lg transition">
              + 系统提示/时间
            </button>
          </div>
        </div>

        <div id="messages-form-list" class="space-y-2.5 max-h-[460px] overflow-y-auto pr-1"></div>
      </section>

    </div>

    <!-- 右侧：手机屏幕实时预览区 (全繁体中文) -->
    <div class="lg:col-span-5 sticky top-20 flex flex-col items-center">
      <div class="text-xs font-semibold text-slate-400 mb-2 uppercase tracking-wider">实时渲染画面 (所见即所得)</div>

      <div id="capture-box" class="transition-all duration-300">
        
        <!-- 外壳模式容器 -->
        <div id="shell-wrap" class="p-0 bg-transparent">
          
          <!-- 手机屏幕本体 (375px 宽度原生高保真视口) -->
          <div id="screen-viewport" class="w-[375px] bg-[#F4F5F9] text-slate-900 mobile-screen flex flex-col relative overflow-hidden shadow-2xl rounded-[32px] min-h-[720px]">
            
            <!-- 状态栏 (采用坚固对齐结构，杜绝变形) -->
            <div class="h-10 px-5 pt-2 flex items-center justify-between text-xs select-none z-20">
              <!-- 左侧：时间与盾牌 -->
              <div class="flex items-center space-x-1.5 h-4">
                <span id="view-time" class="font-semibold text-[13px] tracking-tight leading-none">16:04</span>
                <span id="view-shield" class="baseline-fix text-slate-700">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                </span>
              </div>

              <!-- 右侧：VPN、信号、Wi-Fi、电量 (统一纯 CSS/简单矢量) -->
              <div class="flex items-center space-x-1.5 h-4 text-slate-800">
                <span id="view-vpn" class="px-1 py-[1px] rounded text-[8px] font-black bg-slate-800 text-white leading-none">VPN</span>
                <span id="view-network" class="font-bold text-[10px] leading-none">5G</span>
                
                <!-- 纯正清晰 Wi-Fi 图标 (固定宽高防变形) -->
                <div class="baseline-fix">
                  <svg width="14" height="11" viewBox="0 0 16 12" fill="currentColor">
                    <path d="M8 9.5a1.5 1.5 0 100 3 1.5 1.5 0 000-3zM4.9 7.4a4.4 4.4 0 016.2 0 .8.8 0 001.1-1.1 5.9 5.9 0 00-8.4 0 .8.8 0 001.1 1.1zM1.8 4.3a8.8 8.8 0 0112.4 0 .8.8 0 101.1-1.1 10.3 10.3 0 00-14.6 0 .8.8 0 101.1 1.1z"/>
                  </svg>
                </div>

                <!-- 原生高保真胶囊电池 (纯 CSS 绘制，不依赖易变 SVG) -->
                <div class="baseline-fix space-x-1">
                  <span id="view-battery-num" class="text-[10px] font-bold leading-none">86</span>
                  <div class="flex items-center">
                    <div class="w-[20px] h-[10px] border border-slate-700 rounded-[2.5px] p-[1px] flex items-center">
                      <div id="view-battery-bar" class="h-full bg-slate-800 rounded-[1px]" style="width: 86%;"></div>
                    </div>
                    <div class="w-[1.5px] h-[4px] bg-slate-700 rounded-r-[0.5px]"></div>
                  </div>
                </div>
              </div>
            </div>

            <!-- 顶栏导航：返回键、状态灯与居中对齐名字 -->
            <div class="h-11 px-4 border-b border-slate-200/70 bg-white/90 backdrop-blur flex items-center justify-between z-10">
              <div class="flex items-center space-x-2.5">
                <div class="baseline-fix text-slate-800 cursor-pointer">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
                </div>
                <!-- 名字与在线指示灯水平中线严格对齐 -->
                <div class="inline-flex items-center space-x-1.5 h-6">
                  <span class="w-2 h-2 rounded-full bg-emerald-500 shrink-0"></span>
                  <span id="view-top-name" class="font-bold text-[15px] text-slate-900 leading-none">柔柔</span>
                </div>
              </div>
              <div class="flex items-center space-x-3 text-slate-700">
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z"/></svg>
              </div>
            </div>

            <!-- 名片卡片 (像素级重构基线，标签绝不忽高忽低) -->
            <div class="p-3 mx-3 mt-3 bg-white rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between">
              <div class="flex items-center space-x-3">
                <!-- 头像外壳：锁定宽高，绝对定位绿点紧扣右下角 -->
                <div class="w-12 h-12 rounded-full relative shrink-0">
                  <img id="view-card-avatar" src="" class="w-12 h-12 rounded-full object-cover border border-slate-100" alt="avatar">
                  <span id="view-card-online" class="absolute bottom-0 right-0 w-3 h-3 bg-emerald-500 border-2 border-white rounded-full"></span>
                </div>
                <!-- 文本区 -->
                <div class="flex flex-col justify-center space-y-1">
                  <!-- 第一行：姓名 + 粉色性别年龄标 + 蓝色认证标严格居中 -->
                  <div class="inline-flex items-center space-x-1.5 h-5">
                    <span id="view-card-name" class="font-bold text-[15px] text-slate-900 leading-none">柔柔</span>
                    <span class="inline-flex items-center px-1.5 py-[2px] bg-pink-50 text-pink-500 rounded text-[10px] font-semibold leading-none border border-pink-100">
                      ♀ <span id="view-card-age" class="ml-0.5">23</span>
                    </span>
                    <span class="inline-flex items-center px-1.5 py-[2px] bg-blue-50 text-blue-500 rounded text-[9px] font-bold leading-none border border-blue-100">
                      V 認證
                    </span>
                  </div>
                  <!-- 第二行：基本信息 -->
                  <div id="view-card-sub" class="text-[11px] text-slate-400 leading-none">
                    23歲 · 165cm · 台北市 · 雙子座
                  </div>
                  <!-- 第三行：距离 -->
                  <div class="inline-flex items-center space-x-1 text-[10px] text-blue-500 font-medium leading-none">
                    <svg width="10" height="10" viewBox="0 0 20 20" fill="currentColor" class="shrink-0"><path fill-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd"/></svg>
                    <span id="view-card-dist">距離你約 2.1 km</span>
                  </div>
                </div>
              </div>
              <!-- 关注按钮 -->
              <button class="px-3 py-1 bg-gradient-to-r from-pink-500 to-rose-500 text-white text-xs font-semibold rounded-full shadow-sm leading-none shrink-0">
                + 關注
              </button>
            </div>

            <!-- 对话气泡容器 (锁宽、自动换行、绝不挤掉我方头像) -->
            <div id="view-messages-wrap" class="flex-1 p-3.5 space-y-3 overflow-hidden"></div>

            <!-- 底部输入框 (繁体) -->
            <div class="mt-auto bg-white/95 border-t border-slate-200/70 p-2.5 px-3 flex items-center space-x-2">
              <div class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 shrink-0">
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 100-6 3 3 0 000 6z"/></svg>
              </div>
              <div class="flex-1 bg-slate-100 rounded-full px-3.5 py-1.5 text-xs text-slate-400 select-none flex items-center justify-between">
                <span>發送一條甜蜜的訊息吧...</span>
                <span class="text-slate-300">😊</span>
              </div>
              <div class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center text-white shadow-sm shrink-0">
                <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" class="transform rotate-45 -mt-0.5 -ml-0.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
              </div>
            </div>

            <div class="w-32 h-1 bg-slate-300 rounded-full mx-auto my-1.5"></div>

          </div>
        </div>
      </div>
    </div>

  </main>

  <script>
    // 采用本地 Canvas 生成高清位图头像，确保截屏百分之百清晰完整且永不丢失
    function createHighResAvatar(bgCol, innerCol, text) {
      const c = document.createElement('canvas');
      c.width = 128;
      c.height = 128;
      const ctx = c.getContext('2d');
      // 底色圆
      ctx.fillStyle = bgCol;
      ctx.beginPath();
      ctx.arc(64, 64, 64, 0, Math.PI * 2);
      ctx.fill();
      // 内层立体渐变人物剪影
      ctx.fillStyle = innerCol;
      ctx.beginPath();
      ctx.arc(64, 52, 28, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(64, 120, 44, Math.PI, 0);
      ctx.fill();
      return c.toDataURL('image/png');
    }

    const AVATARS = {
      target: [
        createHighResAvatar('#fed7aa', '#fb7185'),
        createHighResAvatar('#fbcfe8', '#a855f7'),
        createHighResAvatar('#fef08a', '#ec4899'),
        createHighResAvatar('#bae6fd', '#0284c7')
      ],
      my: [
        createHighResAvatar('#e2e8f0', '#475569'),
        createHighResAvatar('#ddd6fe', '#7c3aed')
      ]
    };

    let appState = {
      targetAvatar: AVATARS.target[0],
      myAvatar: AVATARS.my[0],
      messages: [
        { type: "system", content: "Laya 平台提倡真誠交友，請遵守平台《交友守則》" },
        { type: "other", content: "哈囉～看到你也喜歡看展覽！" },
        { type: "me", content: "嗨！對呀，週末剛好去松菸逛逛" },
        { type: "other", content: "太巧了吧！我也很想去那檔新展覽，改天有空要一起喝杯咖啡聊聊嗎？☕" },
        { type: "me", content: "好啊！我知道附近有一家很棒的肉桂捲，下週六下午如何？" },
        { type: "other", content: "太期待了！一言為定囉 ✨" }
      ]
    };

    window.addEventListener("DOMContentLoaded", () => {
      document.getElementById("target-avatar-preview").src = appState.targetAvatar;
      document.getElementById("my-avatar-preview").src = appState.myAvatar;
      renderFormList();
      updateDisplay();
    });

    function setTargetAvatarPreset(idx) {
      appState.targetAvatar = AVATARS.target[idx];
      document.getElementById("target-avatar-preview").src = appState.targetAvatar;
      updateDisplay();
    }
    function setMyAvatarPreset(idx) {
      appState.myAvatar = AVATARS.my[idx];
      document.getElementById("my-avatar-preview").src = appState.myAvatar;
      updateDisplay();
    }

    function handleImageUpload(e, role) {
      const file = e.target.files[0];
      if (!file) return;
      const r = new FileReader();
      r.onload = function(evt) {
        if (role === 'target') {
          appState.targetAvatar = evt.target.result;
          document.getElementById("target-avatar-preview").src = appState.targetAvatar;
        } else {
          appState.myAvatar = evt.target.result;
          document.getElementById("my-avatar-preview").src = appState.myAvatar;
        }
        updateDisplay();
      };
      r.readAsDataURL(file);
    }

    function appendMessage(sender) {
      appState.messages.push({
        type: sender,
        content: sender === 'me' ? '這是一條新發送的信息' : '這是一條對方發來的消息'
      });
      renderFormList();
      updateDisplay();
    }

    function appendNotice() {
      appState.messages.push({
        type: 'system',
        content: '昨天 21:30'
      });
      renderFormList();
      updateDisplay();
    }

    function removeMessage(idx) {
      appState.messages.splice(idx, 1);
      renderFormList();
      updateDisplay();
    }

    function updateMsg(idx, val) {
      appState.messages[idx].content = val;
      updateDisplay();
    }

    function renderFormList() {
      const container = document.getElementById("messages-form-list");
      container.innerHTML = "";

      appState.messages.forEach((msg, idx) => {
        const item = document.createElement("div");
        item.className = "flex items-center gap-2 p-2 bg-slate-50 rounded-xl border border-slate-200";

        let tag = "";
        if (msg.type === 'me') tag = '<span class="px-2 py-0.5 text-[11px] bg-blue-100 text-blue-700 font-semibold rounded shrink-0">我方</span>';
        else if (msg.type === 'other') tag = '<span class="px-2 py-0.5 text-[11px] bg-pink-100 text-pink-700 font-semibold rounded shrink-0">对方</span>';
        else tag = '<span class="px-2 py-0.5 text-[11px] bg-amber-100 text-amber-700 font-semibold rounded shrink-0">系统/时间</span>';

        item.innerHTML = `
          ${tag}
          <input type="text" value="${msg.content.replace(/"/g, '&quot;')}" oninput="updateMsg(${idx}, this.value)" class="flex-1 text-xs px-2.5 py-1.5 bg-white border rounded-lg focus:ring-1 focus:ring-blue-500 outline-none">
          <button onclick="removeMessage(${idx})" class="text-slate-400 hover:text-red-500 px-1 text-base leading-none">&times;</button>
        `;
        container.appendChild(item);
      });
    }

    function loadTemplate(t) {
      if (t === 'icebreak') {
        appState.messages = [
          { type: "system", content: "Laya 平台提倡真誠交友，請遵守平台《交友守則》" },
          { type: "other", content: "哈囉～看到你也喜歡看展覽！" },
          { type: "me", content: "嗨！對呀，週末剛好去松菸逛逛" },
          { type: "other", content: "太巧了吧！我也很想去那檔新展覽，改天有空要一起喝杯咖啡聊聊嗎？☕" }
        ];
      } else {
        appState.messages = [
          { type: "system", content: "星期五 19:42" },
          { type: "other", content: "明天晚上有空嗎？朋友推薦了一家氛圍超棒的餐酒館 🍷" },
          { type: "me", content: "有呀！大概幾點？我提前訂位！" },
          { type: "other", content: "七點半可以嗎？捷運站集合一起過去 ✨" }
        ];
      }
      renderFormList();
      updateDisplay();
    }

    // 核心渲染：严格锁定基准线与容器尺寸
    function updateDisplay() {
      const name = document.getElementById("cfg-name").value || "柔柔";
      const age = document.getElementById("cfg-age").value || "23";
      const height = document.getElementById("cfg-height").value || "165cm";
      const city = document.getElementById("cfg-city").value || "台北市";
      const constel = document.getElementById("cfg-constellation").value || "雙子座";
      const dist = document.getElementById("cfg-distance").value || "約 2.1 km";
      const isOnline = document.getElementById("cfg-online").value === "true";

      document.getElementById("view-top-name").innerText = name;
      document.getElementById("view-card-name").innerText = name;
      document.getElementById("view-card-age").innerText = age;
      document.getElementById("view-card-sub").innerText = `${age}歲 · ${height} · ${city} · ${constel}`;
      document.getElementById("view-card-dist").innerText = `距離你 ${dist}`;
      document.getElementById("view-card-avatar").src = appState.targetAvatar;
      document.getElementById("view-card-online").style.display = isOnline ? "block" : "none";

      // 状态栏
      document.getElementById("view-time").innerText = document.getElementById("status-time").value || "16:04";
      const bat = Math.min(100, Math.max(1, parseInt(document.getElementById("status-battery").value || 86)));
      document.getElementById("view-battery-num").innerText = bat;
      document.getElementById("view-battery-bar").style.width = bat + "%";

      document.getElementById("view-network").innerText = document.getElementById("status-network").value;
      document.getElementById("view-vpn").style.display = document.getElementById("status-vpn").value === "show" ? "inline-block" : "none";
      document.getElementById("view-shield").style.display = document.getElementById("show-shield").checked ? "inline-flex" : "none";

      // 边框切换
      const showFrame = document.getElementById("show-frame").checked;
      const wrap = document.getElementById("shell-wrap");
      if (showFrame) {
        wrap.className = "w-[395px] rounded-[44px] p-[10px] bg-slate-900 shadow-2xl ring-1 ring-slate-800/80";
      } else {
        wrap.className = "p-0 bg-transparent";
      }

      // 渲染气泡
      const msgBox = document.getElementById("view-messages-wrap");
      msgBox.innerHTML = "";

      appState.messages.forEach(msg => {
        if (msg.type === 'system') {
          const sys = document.createElement("div");
          sys.className = "text-center my-1.5";
          sys.innerHTML = `
            <span class="inline-block px-3 py-1 bg-black/[0.04] text-[11px] text-slate-500 rounded-full leading-none">
              ${msg.content}
            </span>
          `;
          msgBox.appendChild(sys);
        } else if (msg.type === 'other') {
          const row = document.createElement("div");
          row.className = "flex items-start space-x-2";
          row.innerHTML = `
            <img src="${appState.targetAvatar}" class="w-9 h-9 rounded-full object-cover shrink-0 mt-0.5 shadow-sm" alt="對方">
            <div class="max-w-[240px] bg-white text-slate-900 text-[13px] leading-[19px] px-3.5 py-2.5 rounded-2xl rounded-tl-sm shadow-sm border border-slate-100 break-words">
              ${msg.content}
            </div>
          `;
          msgBox.appendChild(row);
        } else if (msg.type === 'me') {
          const row = document.createElement("div");
          // 锁定宽度与结构，我方头像 shrink-0 绝不挤爆
          row.className = "flex items-start justify-end space-x-2 w-full";
          row.innerHTML = `
            <div class="max-w-[240px] bg-gradient-to-r from-blue-600 to-indigo-600 text-white text-[13px] leading-[19px] px-3.5 py-2.5 rounded-2xl rounded-tr-sm shadow-sm break-words">
              ${msg.content}
            </div>
            <img src="${appState.myAvatar}" class="w-9 h-9 rounded-full object-cover shrink-0 mt-0.5 shadow-sm" alt="我">
          `;
          msgBox.appendChild(row);
        }
      });
    }

    // 高清图片导出
    function takeScreenshot() {
      const showFrame = document.getElementById("show-frame").checked;
      const targetElem = showFrame ? document.getElementById("shell-wrap") : document.getElementById("screen-viewport");

      html2canvas(targetElem, {
        scale: 3,
        useCORS: true,
        backgroundColor: showFrame ? null : '#F4F5F9',
        logging: false
      }).then(canvas => {
        const link = document.createElement('a');
        link.download = `Laya_Chat_${Date.now()}.png`;
        link.href = canvas.toDataURL("image/png");
        link.click();
      }).catch(err => {
        alert("截屏生成失败：" + err.message);
      });
    }
  </script>
</body>
</html>
