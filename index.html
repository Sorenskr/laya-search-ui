<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laya 聊天记录生成器</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- html2canvas 用于高清网页截图导出 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    /* 自定义美化滚动条 */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    
    /* 繁体苹方/黑体字体配置，还原原生手机端质感 */
    .font-phone {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Heiti TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen flex flex-col">

  <!-- 顶部导航栏 (简体中文) -->
  <header class="bg-gradient-to-r from-blue-700 via-indigo-700 to-blue-800 text-white shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-white/20 backdrop-blur flex items-center justify-center font-bold text-lg tracking-wider border border-white/30 shadow-inner">
          Laya
        </div>
        <div>
          <h1 class="text-lg font-bold leading-tight">Laya 聊天记录生成器</h1>
          <p class="text-xs text-blue-200">一键生成高清逼真对话截图 · 营销与社交展示神器</p>
        </div>
      </div>
      <div class="flex items-center space-x-2">
        <button onclick="applyPreset('icebreak')" class="px-3 py-1.5 text-xs bg-white/10 hover:bg-white/20 rounded-lg transition border border-white/20">
          破冰剧本
        </button>
        <button onclick="applyPreset('dating')" class="px-3 py-1.5 text-xs bg-white/10 hover:bg-white/20 rounded-lg transition border border-white/20">
          约会剧本
        </button>
        <button onclick="exportImage()" class="px-4 py-1.5 text-xs font-semibold bg-emerald-500 hover:bg-emerald-600 text-white rounded-lg transition shadow-md flex items-center gap-1.5">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
          一键导出截图
        </button>
      </div>
    </div>
  </header>

  <!-- 主体工作区 -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 py-6 flex-1 w-full grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
    
    <!-- 左侧控制面板 (100% 简体中文) -->
    <div class="lg:col-span-7 space-y-6">

      <!-- 模块 1：对方与我方资料设置 -->
      <section class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 space-y-4">
        <h2 class="text-base font-bold text-slate-800 flex items-center gap-2 border-b pb-3">
          <span class="w-2 h-4 bg-blue-600 rounded-full"></span>
          对方与个人资料设置
        </h2>
        
        <!-- 对方头像配置 -->
        <div class="space-y-2">
          <label class="block text-xs font-semibold text-slate-600">对方头像（点击预设或自定义上传）</label>
          <div class="flex items-center gap-3">
            <img id="target-avatar-preview" src="" class="w-14 h-14 rounded-full object-cover border-2 border-blue-500 shadow-sm bg-slate-100" alt="头像">
            <div class="flex-1 space-y-2">
              <div class="flex flex-wrap gap-1.5">
                <button type="button" onclick="selectTargetPreset(0)" class="px-2 py-1 text-xs bg-slate-100 hover:bg-blue-50 hover:text-blue-600 rounded border text-slate-600">甜美女生</button>
                <button type="button" onclick="selectTargetPreset(1)" class="px-2 py-1 text-xs bg-slate-100 hover:bg-blue-50 hover:text-blue-600 rounded border text-slate-600">气质御姐</button>
                <button type="button" onclick="selectTargetPreset(2)" class="px-2 py-1 text-xs bg-slate-100 hover:bg-blue-50 hover:text-blue-600 rounded border text-slate-600">可爱少女</button>
                <button type="button" onclick="selectTargetPreset(3)" class="px-2 py-1 text-xs bg-slate-100 hover:bg-blue-50 hover:text-blue-600 rounded border text-slate-600">帅气男生</button>
              </div>
              <label class="inline-flex items-center gap-1.5 px-3 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs rounded cursor-pointer border transition">
                <span>📁 自定义上传对方头像</span>
                <input type="file" accept="image/*" class="hidden" onchange="uploadAvatar(event, 'target')">
              </label>
            </div>
          </div>
        </div>

        <!-- 对方资料输入 -->
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 pt-2">
          <div>
            <label class="block text-xs text-slate-500 mb-1">昵称 (显示在名片与顶栏)</label>
            <input type="text" id="target-name" value="柔柔" oninput="render()" class="w-full text-xs px-2.5 py-1.5 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
          </div>
          <div>
            <label class="block text-xs text-slate-500 mb-1">年龄</label>
            <input type="text" id="target-age" value="23" oninput="render()" class="w-full text-xs px-2.5 py-1.5 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
          </div>
          <div>
            <label class="block text-xs text-slate-500 mb-1">身高</label>
            <input type="text" id="target-height" value="165cm" oninput="render()" class="w-full text-xs px-2.5 py-1.5 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
          </div>
          <div>
            <label class="block text-xs text-slate-500 mb-1">城市地区</label>
            <input type="text" id="target-city" value="台北市" oninput="render()" class="w-full text-xs px-2.5 py-1.5 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
          </div>
        </div>

        <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
          <div>
            <label class="block text-xs text-slate-500 mb-1">星座</label>
            <input type="text" id="target-constellation" value="雙子座" oninput="render()" class="w-full text-xs px-2.5 py-1.5 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
          </div>
          <div>
            <label class="block text-xs text-slate-500 mb-1">距离提示</label>
            <input type="text" id="target-distance" value="約 2.1 km" oninput="render()" class="w-full text-xs px-2.5 py-1.5 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
          </div>
          <div>
            <label class="block text-xs text-slate-500 mb-1">在线状态</label>
            <select id="target-online" onchange="render()" class="w-full text-xs px-2.5 py-1.5 border rounded-lg bg-white outline-none">
              <option value="true">在线 (显示绿点)</option>
              <option value="false">离线 (隐藏绿点)</option>
            </select>
          </div>
        </div>

        <!-- 我方头像配置 -->
        <div class="pt-3 border-t flex items-center justify-between">
          <div class="flex items-center gap-3">
            <img id="my-avatar-preview" src="" class="w-10 h-10 rounded-full object-cover border border-slate-300" alt="我方">
            <div>
              <div class="text-xs font-semibold text-slate-700">我方头像（自己发送的气泡）</div>
              <div class="text-[11px] text-slate-400">支持本地相册图片无损导入</div>
            </div>
          </div>
          <div class="flex items-center gap-2">
            <button type="button" onclick="selectMyPreset(0)" class="px-2 py-1 text-xs bg-slate-100 hover:bg-slate-200 rounded border">阳光男生</button>
            <button type="button" onclick="selectMyPreset(1)" class="px-2 py-1 text-xs bg-slate-100 hover:bg-slate-200 rounded border">潮酷男生</button>
            <label class="px-2.5 py-1 bg-blue-50 hover:bg-blue-100 text-blue-700 text-xs rounded cursor-pointer border border-blue-200">
              <span>自定义上传</span>
              <input type="file" accept="image/*" class="hidden" onchange="uploadAvatar(event, 'my')">
            </label>
          </div>
        </div>
      </section>

      <!-- 模块 2：状态栏与顶部硬件 -->
      <section class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 space-y-4">
        <h2 class="text-base font-bold text-slate-800 flex items-center gap-2 border-b pb-3">
          <span class="w-2 h-4 bg-indigo-600 rounded-full"></span>
          手机状态栏与硬件设置
        </h2>
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
          <div>
            <label class="block text-xs text-slate-500 mb-1">系统时间</label>
            <input type="text" id="status-time" value="16:04" oninput="render()" class="w-full text-xs px-2.5 py-1.5 border rounded-lg outline-none">
          </div>
          <div>
            <label class="block text-xs text-slate-500 mb-1">手机电量 (%)</label>
            <input type="number" id="status-battery" value="86" min="1" max="100" oninput="render()" class="w-full text-xs px-2.5 py-1.5 border rounded-lg outline-none">
          </div>
          <div>
            <label class="block text-xs text-slate-500 mb-1">网络信号</label>
            <select id="status-network" onchange="render()" class="w-full text-xs px-2.5 py-1.5 border rounded-lg bg-white outline-none">
              <option value="5G">双卡 5G + Wi-Fi</option>
              <option value="WIFI">仅满格 Wi-Fi</option>
              <option value="4G">4G 数据信号</option>
            </select>
          </div>
          <div>
            <label class="block text-xs text-slate-500 mb-1">VPN 状态</label>
            <select id="status-vpn" onchange="render()" class="w-full text-xs px-2.5 py-1.5 border rounded-lg bg-white outline-none">
              <option value="show">显示 VPN 图标</option>
              <option value="hide">隐藏 VPN 图标</option>
            </select>
          </div>
        </div>

        <div class="pt-1 flex flex-wrap items-center gap-4 text-xs text-slate-600">
          <label class="flex items-center gap-1.5 cursor-pointer">
            <input type="checkbox" id="show-shield" checked onchange="render()" class="rounded text-blue-600">
            <span>安全盾牌徽标</span>
          </label>
          <label class="flex items-center gap-1.5 cursor-pointer">
            <input type="checkbox" id="show-alipay" checked onchange="render()" class="rounded text-blue-600">
            <span>支付/应用通知角标</span>
          </label>
          <label class="flex items-center gap-1.5 cursor-pointer">
            <input type="checkbox" id="show-camera" checked onchange="render()" class="rounded text-blue-600">
            <span>前置镜头开孔</span>
          </label>
          <label class="flex items-center gap-1.5 cursor-pointer">
            <input type="checkbox" id="show-frame" checked onchange="render()" class="rounded text-blue-600">
            <span>展示黑色拟真机身外壳</span>
          </label>
        </div>
      </section>

      <!-- 模块 3：对话内容编辑 (核心) -->
      <section class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 space-y-4">
        <div class="flex items-center justify-between border-b pb-3">
          <h2 class="text-base font-bold text-slate-800 flex items-center gap-2">
            <span class="w-2 h-4 bg-emerald-600 rounded-full"></span>
            聊天记录编排
          </h2>
          <div class="flex items-center gap-2">
            <button onclick="addMessage('other')" class="px-2.5 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs rounded-lg transition">
              + 对方发消息
            </button>
            <button onclick="addMessage('me')" class="px-2.5 py-1 bg-blue-50 hover:bg-blue-100 text-blue-700 text-xs rounded-lg transition">
              + 我方发消息
            </button>
            <button onclick="addSystemNotice()" class="px-2.5 py-1 bg-amber-50 hover:bg-amber-100 text-amber-700 text-xs rounded-lg transition">
              + 系统守则/时间
            </button>
          </div>
        </div>

        <!-- 消息列表容器 -->
        <div id="messages-editor-list" class="space-y-3 max-h-[480px] overflow-y-auto pr-1">
          <!-- 动态渲染每一条消息编辑项 -->
        </div>
      </section>

      <!-- 模块 4：导出操作 -->
      <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 flex items-center justify-between">
        <div class="text-xs text-slate-500">
          💡 提示：右侧生成图内所有对话、名片与说明均自动按照真实繁体呈现，且支持超高清 2.5x 缩放无损导出。
        </div>
        <button onclick="exportImage()" class="px-6 py-2.5 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-semibold text-sm rounded-xl shadow-lg transition flex items-center gap-2">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
          下载高清 PNG 截图
        </button>
      </div>

    </div>

    <!-- 右侧：手机屏幕实时预览区 (内容全部为地道繁体中文) -->
    <div class="lg:col-span-5 sticky top-20 flex flex-col items-center">
      <div class="text-xs font-semibold text-slate-400 mb-2 uppercase tracking-wider">实时渲染预览 (1:1 原生效果)</div>

      <!-- 手机外框容器 -->
      <div id="capture-container" class="relative transition-all duration-300">
        
        <!-- 拟真机身外壳 -->
        <div id="phone-shell" class="w-[375px] rounded-[44px] p-[10px] bg-slate-900 shadow-2xl ring-1 ring-slate-800/80 relative">
          
          <!-- 屏幕真实显示区域 -->
          <div id="screen-display" class="w-full bg-[#F4F5F9] rounded-[36px] overflow-hidden flex flex-col font-phone text-slate-900 min-h-[750px] relative">
            
            <!-- 状态栏 -->
            <div class="h-11 px-6 pt-2 flex items-center justify-between text-xs font-medium z-20 select-none">
              <!-- 左侧：时间与应用徽标 -->
              <div class="flex items-center space-x-1.5">
                <span id="preview-time" class="font-semibold text-[13px] tracking-tight">16:04</span>
                <span id="preview-shield" class="inline-flex">
                  <svg class="w-3.5 h-3.5 text-slate-700 fill-current" viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 2.18l7 3.12v4.7c0 4.54-3.14 8.79-7 9.92-3.86-1.13-7-5.38-7-9.92V6.3l7-3.12z"/></svg>
                </span>
                <span id="preview-alipay" class="inline-flex">
                  <div class="w-3.5 h-3.5 rounded bg-blue-500 text-[9px] text-white flex items-center justify-center font-bold">支</div>
                </span>
              </div>

              <!-- 顶部前置打孔镜头 -->
              <div id="preview-camera" class="w-4 h-4 rounded-full bg-black/90 ring-1 ring-slate-700/50 -mt-1"></div>

              <!-- 右侧：信号、VPN、Wi-Fi与电量 -->
              <div class="flex items-center space-x-1.5 text-[11px]">
                <span id="preview-vpn" class="px-1 py-[0.5px] rounded text-[8px] font-bold bg-slate-800 text-white">VPN</span>
                <span id="preview-network" class="flex items-center font-semibold text-[10px]">5G</span>
                <!-- Wi-Fi 矢量图标 -->
                <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98C20.93 5.9 16.69 4 12 4zm0 3.32c3.78 0 7.22 1.48 9.77 3.9L12 19.09 2.23 11.22C4.78 8.8 8.22 7.32 12 7.32z"/></svg>
                <!-- 电池胶囊 -->
                <div class="flex items-center space-x-0.5">
                  <span id="preview-battery-num" class="text-[10px] font-bold">86</span>
                  <div class="w-5 h-2.5 border border-slate-700 rounded-sm p-[1px] flex items-center">
                    <div id="preview-battery-bar" class="h-full bg-slate-800 rounded-2xs" style="width: 86%;"></div>
                  </div>
                </div>
              </div>
            </div>

            <!-- Laya 聊天顶部导航栏 (繁体) -->
            <div class="h-12 px-4 border-b border-slate-200/80 bg-white/90 backdrop-blur flex items-center justify-between z-10">
              <div class="flex items-center space-x-2">
                <svg class="w-5 h-5 text-slate-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/></svg>
                <div class="flex items-center space-x-1.5">
                  <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                  <span id="preview-nav-name" class="font-bold text-sm tracking-tight text-slate-800">柔柔</span>
                </div>
              </div>
              <div class="flex items-center space-x-3 text-slate-600">
                <!-- 语音呼叫按钮 -->
                <svg class="w-5 h-5 cursor-pointer" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>
                <!-- 更多选项 -->
                <svg class="w-5 h-5 cursor-pointer" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z"/></svg>
              </div>
            </div>

            <!-- 顶部对方个人名片卡片 (繁体) -->
            <div class="p-3 mx-3 mt-3 bg-white rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between">
              <div class="flex items-center space-x-3">
                <div class="relative">
                  <img id="preview-card-avatar" src="" class="w-12 h-12 rounded-full object-cover border border-slate-100" alt="avatar">
                  <span id="preview-card-online" class="absolute bottom-0 right-0 w-3 h-3 bg-emerald-500 border-2 border-white rounded-full"></span>
                </div>
                <div class="space-y-0.5">
                  <div class="flex items-center space-x-1.5">
                    <span id="preview-card-name" class="font-bold text-sm text-slate-800">柔柔</span>
                    <span class="px-1.5 py-[1px] bg-pink-100 text-pink-600 rounded text-[10px] font-semibold">♀ 23</span>
                    <span class="px-1 py-[1px] bg-blue-50 text-blue-500 rounded text-[9px] font-bold">V 認證</span>
                  </div>
                  <div id="preview-card-details" class="text-[11px] text-slate-400">
                    23歲 · 165cm · 台北市 · 雙子座
                  </div>
                  <div class="text-[10px] text-blue-500 font-medium flex items-center gap-1">
                    <svg class="w-2.5 h-2.5 fill-current" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd"/></svg>
                    <span id="preview-card-dist">距離你約 2.1 km</span>
                  </div>
                </div>
              </div>
              <button class="px-3 py-1 bg-gradient-to-r from-pink-500 to-rose-500 text-white text-xs font-semibold rounded-full shadow-sm">
                + 關注
              </button>
            </div>

            <!-- 对话气泡与消息滚动区 (繁体内容) -->
            <div id="preview-messages-container" class="flex-1 p-3.5 space-y-3.5 overflow-hidden">
              <!-- 动态消息列表 -->
            </div>

            <!-- Laya 底部交互输入栏 (繁体) -->
            <div class="mt-auto bg-white/95 border-t border-slate-200/70 p-2.5 px-3 flex items-center space-x-2">
              <div class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-500">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 100-6 3 3 0 000 6z"/></svg>
              </div>
              <div class="flex-1 bg-slate-100 rounded-full px-3.5 py-1.5 text-xs text-slate-400 select-none flex items-center justify-between">
                <span>發送一條甜蜜的訊息吧...</span>
                <span class="text-slate-300">😊</span>
              </div>
              <div class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center text-white shadow-sm">
                <svg class="w-4 h-4 transform rotate-45 -mt-0.5 -ml-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
              </div>
            </div>

            <!-- 底部返回主屏手势横条 -->
            <div class="w-32 h-1 bg-slate-300 rounded-full mx-auto my-1.5"></div>

          </div>
        </div>
      </div>
    </div>

  </main>

  <script>
    // 预设高颜值头像 (安全纯色/高清SVG数据，杜绝外部图片跨域跨网加载失败)
    const PRESET_AVATARS = {
      target: [
        "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23fed7aa'/><circle cx='50' cy='42' r='22' fill='%23fb7185'/><path d='M25 88c0-18 12-26 25-26s25 8 25 26' fill='%23f43f5e'/><circle cx='43' cy='40' r='2.5' fill='%23fff'/><circle cx='57' cy='40' r='2.5' fill='%23fff'/><path d='M46 50q4 3 8 0' stroke='%23fff' stroke-width='2' fill='none'/></svg>",
        "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23fbcfe8'/><circle cx='50' cy='42' r='22' fill='%23c084fc'/><path d='M22 88c0-18 14-26 28-26s28 8 28 26' fill='%23a855f7'/><circle cx='43' cy='40' r='2.5' fill='%23fff'/><circle cx='57' cy='40' r='2.5' fill='%23fff'/><path d='M46 51q4 2.5 8 0' stroke='%23fff' stroke-width='2' fill='none'/></svg>",
        "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23fef08a'/><circle cx='50' cy='42' r='22' fill='%23f472b6'/><path d='M24 88c0-18 13-26 26-26s26 8 26 26' fill='%23db2777'/><circle cx='43' cy='40' r='2.5' fill='%23fff'/><circle cx='57' cy='40' r='2.5' fill='%23fff'/><circle cx='50' cy='48' r='3' fill='%23f43f5e'/></svg>",
        "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23bae6fd'/><circle cx='50' cy='42' r='22' fill='%2338bdf8'/><path d='M22 88c0-18 14-26 28-26s28 8 28 26' fill='%230284c7'/><circle cx='43' cy='40' r='2.5' fill='%23fff'/><circle cx='57' cy='40' r='2.5' fill='%23fff'/><path d='M45 49q5 2 10 0' stroke='%23fff' stroke-width='2' fill='none'/></svg>"
      ],
      my: [
        "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23e2e8f0'/><circle cx='50' cy='42' r='22' fill='%2364748b'/><path d='M22 88c0-18 14-26 28-26s28 8 28 26' fill='%23334155'/><circle cx='43' cy='40' r='2.5' fill='%23fff'/><circle cx='57' cy='40' r='2.5' fill='%23fff'/></svg>",
        "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23ddd6fe'/><circle cx='50' cy='42' r='22' fill='%238b5cf6'/><path d='M22 88c0-18 14-26 28-26s28 8 28 26' fill='%236d28d9'/><circle cx='43' cy='40' r='2.5' fill='%23fff'/><circle cx='57' cy='40' r='2.5' fill='%23fff'/></svg>"
      ]
    };

    // 应用数据状态
    let appState = {
      targetAvatar: PRESET_AVATARS.target[0],
      myAvatar: PRESET_AVATARS.my[0],
      messages: [
        { type: "system", content: "Laya 平台提倡真誠交友，請遵守平台《交友守則》" },
        { type: "other", content: "哈囉～看到你也喜歡看展覽！" },
        { type: "me", content: "嗨！對呀，週末剛好去松菸逛逛" },
        { type: "other", content: "太巧了吧！我也很想去那檔新展覽，改天有空要一起喝杯咖啡聊聊嗎？☕" },
        { type: "me", content: "好啊！我知道附近有一家很棒的肉桂捲，下週六下午如何？" },
        { type: "other", content: "太期待了！一言為定囉 ✨" }
      ]
    };

    // 初始化运行
    window.addEventListener("DOMContentLoaded", () => {
      document.getElementById("target-avatar-preview").src = appState.targetAvatar;
      document.getElementById("my-avatar-preview").src = appState.myAvatar;
      renderEditorList();
      render();
    });

    // 头像预设切换
    function selectTargetPreset(idx) {
      appState.targetAvatar = PRESET_AVATARS.target[idx];
      document.getElementById("target-avatar-preview").src = appState.targetAvatar;
      render();
    }
    function selectMyPreset(idx) {
      appState.myAvatar = PRESET_AVATARS.my[idx];
      document.getElementById("my-avatar-preview").src = appState.myAvatar;
      render();
    }

    // 头像本地上传 (Base64 处理)
    function uploadAvatar(e, role) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        if (role === 'target') {
          appState.targetAvatar = evt.target.result;
          document.getElementById("target-avatar-preview").src = appState.targetAvatar;
        } else {
          appState.myAvatar = evt.target.result;
          document.getElementById("my-avatar-preview").src = appState.myAvatar;
        }
        render();
      };
      reader.readAsDataURL(file);
    }

    // 添加消息
    function addMessage(sender) {
      appState.messages.push({
        type: sender,
        content: sender === 'me' ? '這是一條新發送的信息' : '這是一條對方發來的消息'
      });
      renderEditorList();
      render();
    }

    function addSystemNotice() {
      appState.messages.push({
        type: 'system',
        content: '昨天 21:30'
      });
      renderEditorList();
      render();
    }

    // 删除消息
    function removeMessage(index) {
      appState.messages.splice(index, 1);
      renderEditorList();
      render();
    }

    // 更新消息文字
    function updateMessageContent(index, val) {
      appState.messages[index].content = val;
      render();
    }

    // 渲染左侧控制面板中的消息列表
    function renderEditorList() {
      const container = document.getElementById("messages-editor-list");
      container.innerHTML = "";

      appState.messages.forEach((msg, idx) => {
        const item = document.createElement("div");
        item.className = "flex items-center gap-2 p-2 bg-slate-50 rounded-xl border border-slate-200";

        let tag = "";
        if (msg.type === 'me') tag = '<span class="px-2 py-0.5 text-[11px] bg-blue-100 text-blue-700 font-semibold rounded shrink-0">我方</span>';
        else if (msg.type === 'other') tag = '<span class="px-2 py-0.5 text-[11px] bg-pink-100 text-pink-700 font-semibold rounded shrink-0">对方</span>';
        else tag = '<span class="px-2 py-0.5 text-[11px] bg-amber-100 text-amber-700 font-semibold rounded shrink-0">系统/时间</span>';

        item.innerHTML = `
          ${tag}
          <input type="text" value="${msg.content.replace(/"/g, '&quot;')}" oninput="updateMessageContent(${idx}, this.value)" class="flex-1 text-xs px-2.5 py-1.5 bg-white border rounded-lg focus:ring-1 focus:ring-blue-500 outline-none">
          <button onclick="removeMessage(${idx})" class="text-slate-400 hover:text-red-500 px-1 text-base leading-none">&times;</button>
        `;
        container.appendChild(item);
      });
    }

    // 快捷情境剧本
    function applyPreset(type) {
      if (type === 'icebreak') {
        appState.messages = [
          { type: "system", content: "Laya 平台提倡真誠交友，請遵守平台《交友守則》" },
          { type: "other", content: "嗨囉！看到你也喜歡戶外活動～" },
          { type: "me", content: "對呀！剛看你主頁有去爬抹茶山，風景超美！" },
          { type: "other", content: "真的！上去雖然累但超值得，下次可以一起揪團！" }
        ];
      } else if (type === 'dating') {
        appState.messages = [
          { type: "system", content: "星期五 19:42" },
          { type: "other", content: "明天晚上有空嗎？朋友推薦了一家氛圍超棒的餐酒館 🍷" },
          { type: "me", content: "有呀！大概幾點？我提前訂位！" },
          { type: "other", content: "七點半可以嗎？捷運站集合一起過去 ✨" },
          { type: "me", content: "沒問題，明天見囉！" }
        ];
      }
      renderEditorList();
      render();
    }

    // 核心渲染函数：更新右侧手机画面
    function render() {
      // 1. 同步资料与名片
      const name = document.getElementById("target-name").value || "柔柔";
      const age = document.getElementById("target-age").value || "23";
      const height = document.getElementById("target-height").value || "165cm";
      const city = document.getElementById("target-city").value || "台北市";
      const constel = document.getElementById("target-constellation").value || "雙子座";
      const dist = document.getElementById("target-distance").value || "約 2.1 km";
      const isOnline = document.getElementById("target-online").value === "true";

      document.getElementById("preview-nav-name").innerText = name;
      document.getElementById("preview-card-name").innerText = name;
      document.getElementById("preview-card-details").innerText = `${age}歲 · ${height} · ${city} · ${constel}`;
      document.getElementById("preview-card-dist").innerText = `距離你 ${dist}`;
      document.getElementById("preview-card-avatar").src = appState.targetAvatar;
      document.getElementById("preview-card-online").style.display = isOnline ? "block" : "none";

      // 2. 状态栏配置
      document.getElementById("preview-time").innerText = document.getElementById("status-time").value || "16:04";
      const battery = Math.min(100, Math.max(1, parseInt(document.getElementById("status-battery").value || 86)));
      document.getElementById("preview-battery-num").innerText = battery;
      document.getElementById("preview-battery-bar").style.width = battery + "%";

      document.getElementById("preview-network").innerText = document.getElementById("status-network").value;
      document.getElementById("preview-vpn").style.display = document.getElementById("status-vpn").value === "show" ? "inline-block" : "none";
      document.getElementById("preview-shield").style.display = document.getElementById("show-shield").checked ? "inline-flex" : "none";
      document.getElementById("preview-alipay").style.display = document.getElementById("show-alipay").checked ? "inline-flex" : "none";
      document.getElementById("preview-camera").style.display = document.getElementById("show-camera").checked ? "block" : "none";

      // 3. 机身外壳展示切换
      const showFrame = document.getElementById("show-frame").checked;
      const phoneShell = document.getElementById("phone-shell");
      if (showFrame) {
        phoneShell.className = "w-[375px] rounded-[44px] p-[10px] bg-slate-900 shadow-2xl ring-1 ring-slate-800/80 relative";
      } else {
        phoneShell.className = "w-[375px] p-0 bg-transparent shadow-none relative";
      }

      // 4. 对话列表渲染 (繁体气泡)
      const container = document.getElementById("preview-messages-container");
      container.innerHTML = "";

      appState.messages.forEach(msg => {
        if (msg.type === 'system') {
          const sysDiv = document.createElement("div");
          sysDiv.className = "text-center my-2";
          sysDiv.innerHTML = `
            <span class="inline-block px-3 py-1 bg-black/5 text-[11px] text-slate-500 rounded-full">
              ${msg.content}
            </span>
          `;
          container.appendChild(sysDiv);
        } else if (msg.type === 'other') {
          const row = document.createElement("div");
          row.className = "flex items-start space-x-2.5";
          row.innerHTML = `
            <img src="${appState.targetAvatar}" class="w-9 h-9 rounded-full object-cover shrink-0 mt-0.5 shadow-sm" alt="對方">
            <div class="max-w-[72%] bg-white text-slate-800 text-[13px] leading-relaxed px-3.5 py-2.5 rounded-2xl rounded-tl-sm shadow-sm border border-slate-100">
              ${msg.content}
            </div>
          `;
          container.appendChild(row);
        } else if (msg.type === 'me') {
          const row = document.createElement("div");
          row.className = "flex items-start justify-end space-x-2.5";
          row.innerHTML = `
            <div class="max-w-[72%] bg-gradient-to-r from-blue-600 to-indigo-600 text-white text-[13px] leading-relaxed px-3.5 py-2.5 rounded-2xl rounded-tr-sm shadow-sm">
              ${msg.content}
            </div>
            <img src="${appState.myAvatar}" class="w-9 h-9 rounded-full object-cover shrink-0 mt-0.5 shadow-sm" alt="我">
          `;
          container.appendChild(row);
        }
      });
    }

    // 高清图片导出
    function exportImage() {
      const captureElem = document.getElementById("show-frame").checked 
        ? document.getElementById("phone-shell") 
        : document.getElementById("screen-display");

      html2canvas(captureElem, {
        scale: 2.5,
        useCORS: true,
        backgroundColor: null,
        logging: false
      }).then(canvas => {
        const link = document.createElement('a');
        link.download = `Laya_Chat_${Date.now()}.png`;
        link.href = canvas.toDataURL("image/png");
        link.click();
      }).catch(err => {
        alert("截屏生成失败，请重试：" + err.message);
      });
    }
  </script>
</body>
</html>
