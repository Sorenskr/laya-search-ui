<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laya 聊天记录生成器 - 玩法增强版</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- html2canvas -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    .mobile-screen {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Heiti TC", "Microsoft JhengHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .baseline-fix {
      display: inline-flex;
      align-items: center;
      vertical-align: middle;
      line-height: 1;
    }
    /* 录音波形动画视觉 */
    .sound-wave-bar {
      width: 2.5px;
      background-color: currentColor;
      border-radius: 9999px;
      display: inline-block;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen flex flex-col">

  <!-- 顶部导航条 -->
  <header class="bg-gradient-to-r from-blue-700 via-indigo-700 to-blue-800 text-white shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-white/20 backdrop-blur flex items-center justify-center font-bold text-lg border border-white/30">
          Laya
        </div>
        <div>
          <h1 class="text-base sm:text-lg font-bold leading-tight">Laya 聊天玩法生成器</h1>
          <p class="text-xs text-blue-200">语音条 · 通话结算 · 私密照片 · 礼物打赏</p>
        </div>
      </div>
      <div class="flex items-center space-x-2">
        <button onclick="loadTemplate('voice')" class="px-2.5 py-1.5 text-xs bg-white/10 hover:bg-white/20 rounded-lg transition border border-white/20">
          🎙️ 语音暧昧剧本
        </button>
        <button onclick="loadTemplate('call')" class="px-2.5 py-1.5 text-xs bg-white/10 hover:bg-white/20 rounded-lg transition border border-white/20">
          📞 通宵连麦剧本
        </button>
        <button onclick="loadTemplate('gift')" class="px-2.5 py-1.5 text-xs bg-white/10 hover:bg-white/20 rounded-lg transition border border-white/20">
          🎁 礼物心动剧本
        </button>
        <button onclick="takeScreenshot()" class="px-4 py-1.5 text-xs font-semibold bg-emerald-500 hover:bg-emerald-600 text-white rounded-lg transition shadow-md flex items-center gap-1.5 ml-2">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
          一键导出截图
        </button>
      </div>
    </div>
  </header>

  <!-- 工作区 -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 py-6 flex-1 w-full grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
    
    <!-- 左侧控制面板 (100% 简体中文) -->
    <div class="lg:col-span-7 space-y-5">

      <!-- 模块 1：资料设置 -->
      <section class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 space-y-4">
        <h2 class="text-sm font-bold text-slate-800 flex items-center gap-2 border-b pb-3">
          <span class="w-2 h-4 bg-blue-600 rounded-full"></span>
          对方资料与顶栏互动状态
        </h2>
        
        <div class="flex items-center gap-4">
          <img id="target-avatar-preview" src="" class="w-14 h-14 rounded-full object-cover border-2 border-blue-500 bg-slate-100 shadow-sm shrink-0" alt="头像">
          <div class="flex-1 space-y-2">
            <div class="flex flex-wrap gap-2">
              <button type="button" onclick="setTargetAvatarPreset(0)" class="px-2.5 py-1 text-xs bg-slate-100 hover:bg-blue-50 hover:text-blue-600 rounded border">甜美女神</button>
              <button type="button" onclick="setTargetAvatarPreset(1)" class="px-2.5 py-1 text-xs bg-slate-100 hover:bg-blue-50 hover:text-blue-600 rounded border">气质御姐</button>
              <button type="button" onclick="setTargetAvatarPreset(2)" class="px-2.5 py-1 text-xs bg-slate-100 hover:bg-blue-50 hover:text-blue-600 rounded border">可爱少女</button>
              <button type="button" onclick="setTargetAvatarPreset(3)" class="px-2.5 py-1 text-xs bg-slate-100 hover:bg-blue-50 hover:text-blue-600 rounded border">阳光男生</button>
            </div>
            <label class="inline-flex items-center gap-1.5 px-3 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs rounded cursor-pointer border">
              <span>📁 上传对方真实相片</span>
              <input type="file" accept="image/*" class="hidden" onchange="handleImageUpload(event, 'target')">
            </label>
          </div>
        </div>

        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 pt-1">
          <div>
            <label class="block text-xs text-slate-500 mb-1">昵称</label>
            <input type="text" id="cfg-name" value="柔柔" oninput="updateDisplay()" class="w-full text-xs px-2.5 py-1.5 border rounded-lg focus:ring-1 focus:ring-blue-500 outline-none">
          </div>
          <div>
            <label class="block text-xs text-slate-500 mb-1">年龄</label>
            <input type="text" id="cfg-age" value="23" oninput="updateDisplay()" class="w-full text-xs px-2.5 py-1.5 border rounded-lg focus:ring-1 focus:ring-blue-500 outline-none">
          </div>
          <div>
            <label class="block text-xs text-slate-500 mb-1">身高</label>
            <input type="text" id="cfg-height" value="165cm" oninput="updateDisplay()" class="w-full text-xs px-2.5 py-1.5 border rounded-lg focus:ring-1 focus:ring-blue-500 outline-none">
          </div>
          <div>
            <label class="block text-xs text-slate-500 mb-1">城市地区</label>
            <input type="text" id="cfg-city" value="台北市" oninput="updateDisplay()" class="w-full text-xs px-2.5 py-1.5 border rounded-lg focus:ring-1 focus:ring-blue-500 outline-none">
          </div>
        </div>

        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
          <div>
            <label class="block text-xs text-slate-500 mb-1">星座</label>
            <input type="text" id="cfg-constellation" value="雙子座" oninput="updateDisplay()" class="w-full text-xs px-2.5 py-1.5 border rounded-lg focus:ring-1 focus:ring-blue-500 outline-none">
          </div>
          <div>
            <label class="block text-xs text-slate-500 mb-1">距离提示</label>
            <input type="text" id="cfg-distance" value="約 2.1 km" oninput="updateDisplay()" class="w-full text-xs px-2.5 py-1.5 border rounded-lg focus:ring-1 focus:ring-blue-500 outline-none">
          </div>
          <div>
            <label class="block text-xs text-slate-500 mb-1">顶栏状态玩法</label>
            <select id="cfg-top-status" onchange="updateDisplay()" class="w-full text-xs px-2.5 py-1.5 border rounded-lg bg-white outline-none">
              <option value="online">🟢 显示在线</option>
              <option value="typing">💬 對方正在輸入中...</option>
              <option value="offline">⚪ 离线</option>
            </select>
          </div>
          <div>
            <label class="block text-xs text-slate-500 mb-1">我方已读标记</label>
            <select id="cfg-show-read" onchange="updateDisplay()" class="w-full text-xs px-2.5 py-1.5 border rounded-lg bg-white outline-none">
              <option value="true">显示「已讀」角标</option>
              <option value="false">隐藏「已讀」角标</option>
            </select>
          </div>
        </div>

        <!-- 我方头像 -->
        <div class="pt-3 border-t flex items-center justify-between">
          <div class="flex items-center gap-3">
            <img id="my-avatar-preview" src="" class="w-10 h-10 rounded-full object-cover border border-slate-300 shrink-0" alt="我">
            <div>
              <div class="text-xs font-semibold text-slate-700">我方头像（自己发送的气泡）</div>
              <div class="text-[11px] text-slate-400">锁死弹性布局，绝对不挤出屏幕</div>
            </div>
          </div>
          <div class="flex items-center gap-2">
            <button type="button" onclick="setMyAvatarPreset(0)" class="px-2 py-1 text-xs bg-slate-100 hover:bg-slate-200 rounded border">型男预设</button>
            <button type="button" onclick="setMyAvatarPreset(1)" class="px-2 py-1 text-xs bg-slate-100 hover:bg-slate-200 rounded border">潮酷预设</button>
            <label class="px-2.5 py-1 bg-blue-50 hover:bg-blue-100 text-blue-700 text-xs rounded cursor-pointer border border-blue-200">
              <span>自定义上传</span>
              <input type="file" accept="image/*" class="hidden" onchange="handleImageUpload(event, 'my')">
            </label>
          </div>
        </div>
      </section>

      <!-- 模块 2：状态栏与硬件外观 -->
      <section class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 space-y-4">
        <h2 class="text-sm font-bold text-slate-800 flex items-center gap-2 border-b pb-3">
          <span class="w-2 h-4 bg-indigo-600 rounded-full"></span>
          状态栏与外观设置
        </h2>
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
          <div>
            <label class="block text-xs text-slate-500 mb-1">系统时间</label>
            <input type="text" id="status-time" value="16:04" oninput="updateDisplay()" class="w-full text-xs px-2.5 py-1.5 border rounded-lg outline-none">
          </div>
          <div>
            <label class="block text-xs text-slate-500 mb-1">手机电量 (%)</label>
            <input type="number" id="status-battery" value="86" min="1" max="100" oninput="updateDisplay()" class="w-full text-xs px-2.5 py-1.5 border rounded-lg outline-none">
          </div>
          <div>
            <label class="block text-xs text-slate-500 mb-1">网络图标</label>
            <select id="status-network" onchange="updateDisplay()" class="w-full text-xs px-2.5 py-1.5 border rounded-lg bg-white outline-none">
              <option value="5G">5G + Wi-Fi</option>
              <option value="4G">4G 数据信号</option>
              <option value="WIFI">纯 Wi-Fi 信号</option>
            </select>
          </div>
          <div>
            <label class="block text-xs text-slate-500 mb-1">VPN 标识</label>
            <select id="status-vpn" onchange="updateDisplay()" class="w-full text-xs px-2.5 py-1.5 border rounded-lg bg-white outline-none">
              <option value="show">显示 VPN</option>
              <option value="hide">隐藏 VPN</option>
            </select>
          </div>
        </div>

        <div class="flex flex-wrap items-center gap-4 text-xs text-slate-600 pt-1">
          <label class="flex items-center gap-1.5 cursor-pointer">
            <input type="checkbox" id="show-shield" checked onchange="updateDisplay()" class="rounded text-blue-600">
            <span>安全盾牌徽标</span>
          </label>
          <label class="flex items-center gap-1.5 cursor-pointer">
            <input type="checkbox" id="show-frame" onchange="updateDisplay()" class="rounded text-blue-600">
            <span>带黑色真机外壳导出 (不勾选为纯净截图)</span>
          </label>
        </div>
      </section>

      <!-- 模块 3：玩法与消息编排 (核心扩展) -->
      <section class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 space-y-4">
        <div class="flex items-center justify-between border-b pb-3">
          <h2 class="text-sm font-bold text-slate-800 flex items-center gap-2">
            <span class="w-2 h-4 bg-emerald-600 rounded-full"></span>
            聊天玩法与内容编排
          </h2>
          <span class="text-xs text-slate-400">点击下方按钮添加不同类型的互动消息</span>
        </div>

        <!-- 丰富玩法按钮矩阵 -->
        <div class="grid grid-cols-3 sm:grid-cols-6 gap-2">
          <button onclick="appendMsg('other_text')" class="px-2 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs rounded-lg transition font-medium">
            💬 对方文字
          </button>
          <button onclick="appendMsg('me_text')" class="px-2 py-1.5 bg-blue-50 hover:bg-blue-100 text-blue-700 text-xs rounded-lg transition font-medium">
            💬 我方文字
          </button>
          <button onclick="appendMsg('other_voice')" class="px-2 py-1.5 bg-pink-50 hover:bg-pink-100 text-pink-700 text-xs rounded-lg transition font-medium">
            🎙️ 对方语音
          </button>
          <button onclick="appendMsg('me_voice')" class="px-2 py-1.5 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 text-xs rounded-lg transition font-medium">
            🎙️ 我方语音
          </button>
          <button onclick="appendMsg('call')" class="px-2 py-1.5 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 text-xs rounded-lg transition font-medium">
            📞 通话结算
          </button>
          <button onclick="appendMsg('gift')" class="px-2 py-1.5 bg-amber-50 hover:bg-amber-100 text-amber-700 text-xs rounded-lg transition font-medium">
            🎁 礼物打赏
          </button>
          <button onclick="appendMsg('photo')" class="px-2 py-1.5 bg-purple-50 hover:bg-purple-100 text-purple-700 text-xs rounded-lg transition font-medium col-span-2">
            🔒 私密照片卡片
          </button>
          <button onclick="appendMsg('system')" class="px-2 py-1.5 bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs rounded-lg transition font-medium col-span-4">
            ⏰ 时间戳 / 系统公约
          </button>
        </div>

        <!-- 编辑列表 -->
        <div id="messages-form-list" class="space-y-2.5 max-h-[500px] overflow-y-auto pr-1"></div>
      </section>

    </div>

    <!-- 右侧：手机屏幕实时预览区 (全繁体中文) -->
    <div class="lg:col-span-5 sticky top-20 flex flex-col items-center">
      <div class="text-xs font-semibold text-slate-400 mb-2 uppercase tracking-wider">实时渲染画面 (所见即所得)</div>

      <div id="capture-box" class="transition-all duration-300">
        
        <!-- 外壳模式容器 -->
        <div id="shell-wrap" class="p-0 bg-transparent">
          
          <!-- 手机屏幕本体 -->
          <div id="screen-viewport" class="w-[375px] bg-[#F4F5F9] text-slate-900 mobile-screen flex flex-col relative overflow-hidden shadow-2xl rounded-[32px] min-h-[740px]">
            
            <!-- 状态栏 (基线严格对齐) -->
            <div class="h-10 px-5 pt-2 flex items-center justify-between text-xs select-none z-20">
              <div class="flex items-center space-x-1.5 h-4">
                <span id="view-time" class="font-semibold text-[13px] tracking-tight leading-none">16:04</span>
                <span id="view-shield" class="baseline-fix text-slate-700">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                </span>
              </div>

              <div class="flex items-center space-x-1.5 h-4 text-slate-800">
                <span id="view-vpn" class="px-1 py-[1px] rounded text-[8px] font-black bg-slate-800 text-white leading-none">VPN</span>
                <span id="view-network" class="font-bold text-[10px] leading-none">5G</span>
                
                <div class="baseline-fix">
                  <svg width="14" height="11" viewBox="0 0 16 12" fill="currentColor">
                    <path d="M8 9.5a1.5 1.5 0 100 3 1.5 1.5 0 000-3zM4.9 7.4a4.4 4.4 0 016.2 0 .8.8 0 001.1-1.1 5.9 5.9 0 00-8.4 0 .8.8 0 001.1 1.1zM1.8 4.3a8.8 8.8 0 0112.4 0 .8.8 0 101.1-1.1 10.3 10.3 0 00-14.6 0 .8.8 0 101.1 1.1z"/>
                  </svg>
                </div>

                <div class="baseline-fix space-x-1">
                  <span id="view-battery-num" class="text-[10px] font-bold leading-none">86</span>
                  <div class="flex items-center">
                    <div class="w-[20px] h-[10px] border border-slate-700 rounded-[2.5px] p-[1px] flex items-center">
                      <div id="view-battery-bar" class="h-full bg-slate-800 rounded-[1px]" style="width: 86%;"></div>
                    </div>
                    <div class="w-[1.5px] h-[4px] bg-slate-700 rounded-r-[0.5px]"></div>
                  </div>
                </div>
              </div>
            </div>

            <!-- 顶栏导航：支持「对方正在输入中...」玩法 -->
            <div class="h-11 px-4 border-b border-slate-200/70 bg-white/90 backdrop-blur flex items-center justify-between z-10">
              <div class="flex items-center space-x-2.5">
                <div class="baseline-fix text-slate-800 cursor-pointer">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
                </div>
                <div class="flex flex-col justify-center">
                  <div class="inline-flex items-center space-x-1.5 h-5">
                    <span id="view-top-dot" class="w-2 h-2 rounded-full bg-emerald-500 shrink-0"></span>
                    <span id="view-top-name" class="font-bold text-[15px] text-slate-900 leading-none">柔柔</span>
                  </div>
                  <div id="view-top-subtext" class="text-[10px] text-pink-500 font-medium leading-none hidden">
                    對方正在輸入中...
                  </div>
                </div>
              </div>
              <div class="flex items-center space-x-3 text-slate-700">
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z"/></svg>
              </div>
            </div>

            <!-- 名片卡片 -->
            <div class="p-3 mx-3 mt-3 bg-white rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between">
              <div class="flex items-center space-x-3">
                <div class="w-12 h-12 rounded-full relative shrink-0">
                  <img id="view-card-avatar" src="" class="w-12 h-12 rounded-full object-cover border border-slate-100" alt="avatar">
                  <span id="view-card-online" class="absolute bottom-0 right-0 w-3 h-3 bg-emerald-500 border-2 border-white rounded-full"></span>
                </div>
                <div class="flex flex-col justify-center space-y-1">
                  <div class="inline-flex items-center space-x-1.5 h-5">
                    <span id="view-card-name" class="font-bold text-[15px] text-slate-900 leading-none">柔柔</span>
                    <span class="inline-flex items-center px-1.5 py-[2px] bg-pink-50 text-pink-500 rounded text-[10px] font-semibold leading-none border border-pink-100">
                      ♀ <span id="view-card-age" class="ml-0.5">23</span>
                    </span>
                    <span class="inline-flex items-center px-1.5 py-[2px] bg-blue-50 text-blue-500 rounded text-[9px] font-bold leading-none border border-blue-100">
                      V 認證
                    </span>
                  </div>
                  <div id="view-card-sub" class="text-[11px] text-slate-400 leading-none">
                    23歲 · 165cm · 台北市 · 雙子座
                  </div>
                  <div class="inline-flex items-center space-x-1 text-[10px] text-blue-500 font-medium leading-none">
                    <svg width="10" height="10" viewBox="0 0 20 20" fill="currentColor" class="shrink-0"><path fill-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd"/></svg>
                    <span id="view-card-dist">距離你約 2.1 km</span>
                  </div>
                </div>
              </div>
              <button class="px-3 py-1 bg-gradient-to-r from-pink-500 to-rose-500 text-white text-xs font-semibold rounded-full shadow-sm leading-none shrink-0">
                + 關注
              </button>
            </div>

            <!-- 对话气泡容器 (玩法气泡呈现) -->
            <div id="view-messages-wrap" class="flex-1 p-3.5 space-y-3 overflow-hidden"></div>

            <!-- 底部输入框 (繁体) -->
            <div class="mt-auto bg-white/95 border-t border-slate-200/70 p-2.5 px-3 flex items-center space-x-2">
              <div class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 shrink-0">
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 100-6 3 3 0 000 6z"/></svg>
              </div>
              <div class="flex-1 bg-slate-100 rounded-full px-3.5 py-1.5 text-xs text-slate-400 select-none flex items-center justify-between">
                <span>發送一條甜蜜的訊息吧...</span>
                <span class="text-slate-300">😊</span>
              </div>
              <div class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center text-white shadow-sm shrink-0">
                <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" class="transform rotate-45 -mt-0.5 -ml-0.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
              </div>
            </div>

            <div class="w-32 h-1 bg-slate-300 rounded-full mx-auto my-1.5"></div>

          </div>
        </div>
      </div>
    </div>

  </main>

  <script>
    // 本地 Canvas 高清头像生成
    function createHighResAvatar(bgCol, innerCol) {
      const c = document.createElement('canvas');
      c.width = 128; c.height = 128;
      const ctx = c.getContext('2d');
      ctx.fillStyle = bgCol;
      ctx.beginPath(); ctx.arc(64, 64, 64, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = innerCol;
      ctx.beginPath(); ctx.arc(64, 52, 28, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(64, 120, 44, Math.PI, 0); ctx.fill();
      return c.toDataURL('image/png');
    }

    const AVATARS = {
      target: [
        createHighResAvatar('#fed7aa', '#fb7185'),
        createHighResAvatar('#fbcfe8', '#a855f7'),
        createHighResAvatar('#fef08a', '#ec4899'),
        createHighResAvatar('#bae6fd', '#0284c7')
      ],
      my: [
        createHighResAvatar('#e2e8f0', '#475569'),
        createHighResAvatar('#ddd6fe', '#7c3aed')
      ]
    };

    // 数据结构支持丰富玩法
    let appState = {
      targetAvatar: AVATARS.target[0],
      myAvatar: AVATARS.my[0],
      messages: [
        { type: "system", content: "Laya 平台提倡真誠交友，請遵守平台《交友守則》" },
        { type: "other_voice", sec: 18, unread: true },
        { type: "me_text", content: "剛聽了你的語音，聲音也太甜了吧！" },
        { type: "other_text", content: "哪有啦～平常講話就這樣呀 🥰" },
        { type: "photo", content: "「生活隨手拍」", blurred: true },
        { type: "call", duration: "42:15" },
        { type: "me_text", content: "昨晚聊得好開心，下次換我打給你～" }
      ]
    };

    window.addEventListener("DOMContentLoaded", () => {
      document.getElementById("target-avatar-preview").src = appState.targetAvatar;
      document.getElementById("my-avatar-preview").src = appState.myAvatar;
      renderFormList();
      updateDisplay();
    });

    function setTargetAvatarPreset(idx) {
      appState.targetAvatar = AVATARS.target[idx];
      document.getElementById("target-avatar-preview").src = appState.targetAvatar;
      updateDisplay();
    }
    function setMyAvatarPreset(idx) {
      appState.myAvatar = AVATARS.my[idx];
      document.getElementById("my-avatar-preview").src = appState.myAvatar;
      updateDisplay();
    }

    function handleImageUpload(e, role) {
      const file = e.target.files[0];
      if (!file) return;
      const r = new FileReader();
      r.onload = function(evt) {
        if (role === 'target') {
          appState.targetAvatar = evt.target.result;
          document.getElementById("target-avatar-preview").src = appState.targetAvatar;
        } else {
          appState.myAvatar = evt.target.result;
          document.getElementById("my-avatar-preview").src = appState.myAvatar;
        }
        updateDisplay();
      };
      r.readAsDataURL(file);
    }

    // 添加各种玩法的消息
    function appendMsg(type) {
      if (type === 'other_text') {
        appState.messages.push({ type: 'other_text', content: '對方的一條新消息' });
      } else if (type === 'me_text') {
        appState.messages.push({ type: 'me_text', content: '我方的一條新回復' });
      } else if (type === 'other_voice') {
        appState.messages.push({ type: 'other_voice', sec: 15, unread: true });
      } else if (type === 'me_voice') {
        appState.messages.push({ type: 'me_voice', sec: 8 });
      } else if (type === 'call') {
        appState.messages.push({ type: 'call', duration: '35:20' });
      } else if (type === 'gift') {
        appState.messages.push({ type: 'gift', giftName: '璀璨城堡', count: 1 });
      } else if (type === 'photo') {
        appState.messages.push({ type: 'photo', content: '「私密日常照片」', blurred: true });
      } else if (type === 'system') {
        appState.messages.push({ type: 'system', content: '昨天 23:45' });
      }
      renderFormList();
      updateDisplay();
    }

    function removeMsg(idx) {
      appState.messages.splice(idx, 1);
      renderFormList();
      updateDisplay();
    }

    function updateMsgField(idx, field, val) {
      appState.messages[idx][field] = val;
      updateDisplay();
    }

    // 渲染左侧表单项
    function renderFormList() {
      const c = document.getElementById("messages-form-list");
      c.innerHTML = "";

      appState.messages.forEach((m, idx) => {
        const item = document.createElement("div");
        item.className = "p-2.5 bg-slate-50 rounded-xl border border-slate-200 flex items-center justify-between gap-2";

        let controls = "";
        if (m.type === 'other_text') {
          controls = `
            <span class="px-2 py-0.5 text-[11px] bg-pink-100 text-pink-700 font-semibold rounded shrink-0">对方文字</span>
            <input type="text" value="${m.content.replace(/"/g, '&quot;')}" oninput="updateMsgField(${idx}, 'content', this.value)" class="flex-1 text-xs px-2 py-1 bg-white border rounded outline-none">
          `;
        } else if (m.type === 'me_text') {
          controls = `
            <span class="px-2 py-0.5 text-[11px] bg-blue-100 text-blue-700 font-semibold rounded shrink-0">我方文字</span>
            <input type="text" value="${m.content.replace(/"/g, '&quot;')}" oninput="updateMsgField(${idx}, 'content', this.value)" class="flex-1 text-xs px-2 py-1 bg-white border rounded outline-none">
          `;
        } else if (m.type === 'other_voice') {
          controls = `
            <span class="px-2 py-0.5 text-[11px] bg-pink-100 text-pink-700 font-semibold rounded shrink-0">🎙️ 对方语音</span>
            <span class="text-xs text-slate-500">时长:</span>
            <input type="number" value="${m.sec}" min="1" max="60" oninput="updateMsgField(${idx}, 'sec', this.value)" class="w-16 text-xs px-2 py-1 bg-white border rounded outline-none">
            <span class="text-xs text-slate-400">秒</span>
            <label class="flex items-center gap-1 text-xs text-slate-600 ml-2">
              <input type="checkbox" ${m.unread ? 'checked' : ''} onchange="updateMsgField(${idx}, 'unread', this.checked)">
              <span>未读红点</span>
            </label>
          `;
        } else if (m.type === 'me_voice') {
          controls = `
            <span class="px-2 py-0.5 text-[11px] bg-indigo-100 text-indigo-700 font-semibold rounded shrink-0">🎙️ 我方语音</span>
            <span class="text-xs text-slate-500">时长:</span>
            <input type="number" value="${m.sec}" min="1" max="60" oninput="updateMsgField(${idx}, 'sec', this.value)" class="w-16 text-xs px-2 py-1 bg-white border rounded outline-none">
            <span class="text-xs text-slate-400">秒</span>
          `;
        } else if (m.type === 'call') {
          controls = `
            <span class="px-2 py-0.5 text-[11px] bg-emerald-100 text-emerald-700 font-semibold rounded shrink-0">📞 通话结算</span>
            <span class="text-xs text-slate-500">时长:</span>
            <input type="text" value="${m.duration}" oninput="updateMsgField(${idx}, 'duration', this.value)" class="w-24 text-xs px-2 py-1 bg-white border rounded outline-none" placeholder="42:15">
          `;
        } else if (m.type === 'gift') {
          controls = `
            <span class="px-2 py-0.5 text-[11px] bg-amber-100 text-amber-700 font-semibold rounded shrink-0">🎁 礼物打赏</span>
            <input type="text" value="${m.giftName}" oninput="updateMsgField(${idx}, 'giftName', this.value)" class="flex-1 text-xs px-2 py-1 bg-white border rounded outline-none" placeholder="礼物名">
          `;
        } else if (m.type === 'photo') {
          controls = `
            <span class="px-2 py-0.5 text-[11px] bg-purple-100 text-purple-700 font-semibold rounded shrink-0">🔒 私密照片</span>
            <input type="text" value="${m.content}" oninput="updateMsgField(${idx}, 'content', this.value)" class="flex-1 text-xs px-2 py-1 bg-white border rounded outline-none">
          `;
        } else {
          controls = `
            <span class="px-2 py-0.5 text-[11px] bg-gray-200 text-gray-700 font-semibold rounded shrink-0">系统/时间</span>
            <input type="text" value="${m.content}" oninput="updateMsgField(${idx}, 'content', this.value)" class="flex-1 text-xs px-2 py-1 bg-white border rounded outline-none">
          `;
        }

        item.innerHTML = `
          <div class="flex items-center gap-2 flex-1">${controls}</div>
          <button onclick="removeMsg(${idx})" class="text-slate-400 hover:text-red-500 px-1 text-base">&times;</button>
        `;
        c.appendChild(item);
      });
    }

    // 预设剧本切换
    function loadTemplate(t) {
      if (t === 'voice') {
        appState.messages = [
          { type: "system", content: "Laya 平台提倡真誠交友，請遵守平台《交友守則》" },
          { type: "other_voice", sec: 23, unread: true },
          { type: "me_text", content: "天啊，你的聲音也太酥了吧！聽了心跳好快" },
          { type: "other_voice", sec: 9, unread: false },
          { type: "me_voice", sec: 14 },
          { type: "other_text", content: "討厭，你的聲音也很有磁性好不好 🥰" }
        ];
      } else if (t === 'call') {
        appState.messages = [
          { type: "system", content: "昨天 01:20" },
          { type: "other_text", content: "睡不著...可以陪我說說話嗎？" },
          { type: "me_text", content: "沒問題，我打給你！" },
          { type: "call", duration: "01:28:40" },
          { type: "other_text", content: "謝謝你陪我聊了一整晚，晚安好夢囉 🌙" },
          { type: "me_text", content: "晚安，今天下班再去接你吃早餐 ✨" }
        ];
      } else if (t === 'gift') {
        appState.messages = [
          { type: "system", content: "星期六 20:15" },
          { type: "other_text", content: "好可惜，今天差一點點就能拿到人氣榜一了 🥺" },
          { type: "gift", giftName: "璀璨星空城堡", count: 1 },
          { type: "other_text", content: "哇啊啊！你怎麼突然送我這個！太感動了吧！！😭❤️" },
          { type: "me_text", content: "在我的世界裡，你永遠都是第一名 ✨" }
        ];
      }
      renderFormList();
      updateDisplay();
    }

    // 核心渲染
    function updateDisplay() {
      const name = document.getElementById("cfg-name").value || "柔柔";
      const age = document.getElementById("cfg-age").value || "23";
      const height = document.getElementById("cfg-height").value || "165cm";
      const city = document.getElementById("cfg-city").value || "台北市";
      const constel = document.getElementById("cfg-constellation").value || "雙子座";
      const dist = document.getElementById("cfg-distance").value || "約 2.1 km";
      const topStatus = document.getElementById("cfg-top-status").value;
      const showRead = document.getElementById("cfg-show-read").value === 'true';

      // 顶栏名字与输入中状态
      document.getElementById("view-top-name").innerText = name;
      const topDot = document.getElementById("view-top-dot");
      const topSub = document.getElementById("view-top-subtext");
      if (topStatus === 'typing') {
        topDot.style.display = "none";
        topSub.classList.remove("hidden");
      } else if (topStatus === 'online') {
        topDot.style.display = "block";
        topDot.className = "w-2 h-2 rounded-full bg-emerald-500 shrink-0";
        topSub.classList.add("hidden");
      } else {
        topDot.style.display = "none";
        topSub.classList.add("hidden");
      }

      // 名片
      document.getElementById("view-card-name").innerText = name;
      document.getElementById("view-card-age").innerText = age;
      document.getElementById("view-card-sub").innerText = `${age}歲 · ${height} · ${city} · ${constel}`;
      document.getElementById("view-card-dist").innerText = `距離你 ${dist}`;
      document.getElementById("view-card-avatar").src = appState.targetAvatar;
      document.getElementById("view-card-online").style.display = topStatus === 'online' ? "block" : "none";

      // 状态栏
      document.getElementById("view-time").innerText = document.getElementById("status-time").value || "16:04";
      const bat = Math.min(100, Math.max(1, parseInt(document.getElementById("status-battery").value || 86)));
      document.getElementById("view-battery-num").innerText = bat;
      document.getElementById("view-battery-bar").style.width = bat + "%";

      document.getElementById("view-network").innerText = document.getElementById("status-network").value;
      document.getElementById("view-vpn").style.display = document.getElementById("status-vpn").value === "show" ? "inline-block" : "none";
      document.getElementById("view-shield").style.display = document.getElementById("show-shield").checked ? "inline-flex" : "none";

      // 外壳
      const showFrame = document.getElementById("show-frame").checked;
      const wrap = document.getElementById("shell-wrap");
      wrap.className = showFrame ? "w-[395px] rounded-[44px] p-[10px] bg-slate-900 shadow-2xl ring-1 ring-slate-800/80" : "p-0 bg-transparent";

      // 对话列表玩法渲染
      const box = document.getElementById("view-messages-wrap");
      box.innerHTML = "";

      appState.messages.forEach(m => {
        if (m.type === 'system') {
          const d = document.createElement("div");
          d.className = "text-center my-1.5";
          d.innerHTML = `<span class="inline-block px-3 py-1 bg-black/[0.04] text-[11px] text-slate-500 rounded-full leading-none">${m.content}</span>`;
          box.appendChild(d);
        } else if (m.type === 'other_text') {
          const d = document.createElement("div");
          d.className = "flex items-start space-x-2";
          d.innerHTML = `
            <img src="${appState.targetAvatar}" class="w-9 h-9 rounded-full object-cover shrink-0 mt-0.5 shadow-sm" alt="對方">
            <div class="max-w-[240px] bg-white text-slate-900 text-[13px] leading-[19px] px-3.5 py-2.5 rounded-2xl rounded-tl-sm shadow-sm border border-slate-100 break-words">
              ${m.content}
            </div>
          `;
          box.appendChild(d);
        } else if (m.type === 'me_text') {
          const d = document.createElement("div");
          d.className = "flex items-start justify-end space-x-2 w-full";
          const readBadge = showRead ? `<span class="text-[9px] text-slate-400 self-end mr-1 pb-1 font-medium">已讀</span>` : '';
          d.innerHTML = `
            ${readBadge}
            <div class="max-w-[240px] bg-gradient-to-r from-blue-600 to-indigo-600 text-white text-[13px] leading-[19px] px-3.5 py-2.5 rounded-2xl rounded-tr-sm shadow-sm break-words">
              ${m.content}
            </div>
            <img src="${appState.myAvatar}" class="w-9 h-9 rounded-full object-cover shrink-0 mt-0.5 shadow-sm" alt="我">
          `;
          box.appendChild(d);
        } else if (m.type === 'other_voice') {
          // 对方语音条
          const d = document.createElement("div");
          d.className = "flex items-start space-x-2";
          const redDot = m.unread ? `<span class="w-2 h-2 rounded-full bg-rose-500 shrink-0 self-center ml-1.5"></span>` : '';
          d.innerHTML = `
            <img src="${appState.targetAvatar}" class="w-9 h-9 rounded-full object-cover shrink-0 mt-0.5 shadow-sm" alt="對方">
            <div class="flex items-center">
              <div class="bg-white text-slate-800 px-3.5 py-2.5 rounded-2xl rounded-tl-sm shadow-sm border border-slate-100 flex items-center space-x-3 min-w-[110px]">
                <div class="flex items-center space-x-1 text-blue-600 h-4">
                  <span class="sound-wave-bar h-2"></span>
                  <span class="sound-wave-bar h-4"></span>
                  <span class="sound-wave-bar h-3"></span>
                  <span class="sound-wave-bar h-5"></span>
                  <span class="sound-wave-bar h-2"></span>
                </div>
                <span class="text-xs font-semibold text-slate-600">${m.sec}''</span>
              </div>
              ${redDot}
            </div>
          `;
          box.appendChild(d);
        } else if (m.type === 'me_voice') {
          // 我方语音条
          const d = document.createElement("div");
          d.className = "flex items-start justify-end space-x-2 w-full";
          const readBadge = showRead ? `<span class="text-[9px] text-slate-400 self-end mr-1 pb-1 font-medium">已讀</span>` : '';
          d.innerHTML = `
            ${readBadge}
            <div class="bg-gradient-to-r from-blue-600 to-indigo-600 text-white px-3.5 py-2.5 rounded-2xl rounded-tr-sm shadow-sm flex items-center space-x-3 min-w-[100px] justify-between">
              <span class="text-xs font-semibold">${m.sec}''</span>
              <div class="flex items-center space-x-1 text-white h-4">
                <span class="sound-wave-bar h-2"></span>
                <span class="sound-wave-bar h-4"></span>
                <span class="sound-wave-bar h-3"></span>
                <span class="sound-wave-bar h-5"></span>
                <span class="sound-wave-bar h-2"></span>
              </div>
            </div>
            <img src="${appState.myAvatar}" class="w-9 h-9 rounded-full object-cover shrink-0 mt-0.5 shadow-sm" alt="我">
          `;
          box.appendChild(d);
        } else if (m.type === 'call') {
          // 通话结算卡片
          const d = document.createElement("div");
          d.className = "flex justify-center my-1";
          d.innerHTML = `
            <div class="px-4 py-2 bg-white rounded-full shadow-sm border border-slate-100 flex items-center space-x-2 text-xs">
              <div class="w-5 h-5 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center">
                <svg width="11" height="11" fill="currentColor" viewBox="0 0 20 20"><path d="M2 3a1 1 0 011-1h2.153a1 1 0 01.986.836l.74 4.435a1 1 0 01-.54 1.06l-1.548.773a11.037 11.037 0 006.105 6.105l.774-1.548a1 1 0 011.059-.54l4.435.74a1 1 0 01.836.986V17a1 1 0 01-1 1h-2C7.82 18 2 12.18 2 4V3z"/></svg>
              </div>
              <span class="text-slate-600 font-medium">語音通話結束，時長 ${m.duration}</span>
            </div>
          `;
          box.appendChild(d);
        } else if (m.type === 'gift') {
          // 礼物打赏卡片
          const d = document.createElement("div");
          d.className = "flex justify-center my-1";
          d.innerHTML = `
            <div class="px-4 py-2 bg-gradient-to-r from-amber-50 to-orange-50 rounded-2xl border border-amber-200/80 shadow-sm flex items-center space-x-2.5">
              <span class="text-xl">🎁</span>
              <div class="text-xs">
                <div class="font-bold text-amber-900 leading-none">送出「${m.giftName}」x1</div>
                <div class="text-[10px] text-amber-600 mt-1 leading-none">心動值 +9999 · 觸發全屏心動特效</div>
              </div>
            </div>
          `;
          box.appendChild(d);
        } else if (m.type === 'photo') {
          // 阅后即焚/私密照片卡片
          const d = document.createElement("div");
          d.className = "flex items-start space-x-2";
          d.innerHTML = `
            <img src="${appState.targetAvatar}" class="w-9 h-9 rounded-full object-cover shrink-0 mt-0.5 shadow-sm" alt="對方">
            <div class="relative w-44 h-32 rounded-2xl overflow-hidden shadow-sm border border-slate-200 bg-slate-800 flex flex-col items-center justify-center text-white p-3">
              <!-- 模拟高斯模糊背景色块 -->
              <div class="absolute inset-0 bg-gradient-to-tr from-pink-500/40 via-purple-600/40 to-blue-500/40 backdrop-blur-md"></div>
              <div class="relative z-10 flex flex-col items-center space-y-1">
                <div class="w-8 h-8 rounded-full bg-white/20 backdrop-blur flex items-center justify-center">
                  <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                </div>
                <div class="text-xs font-bold tracking-wide">${m.content}</div>
                <div class="text-[9px] text-white/80">🔒 私密相片 · 點擊解鎖</div>
              </div>
            </div>
          `;
          box.appendChild(d);
        }
      });
    }

    // 高清图片导出
    function takeScreenshot() {
      const showFrame = document.getElementById("show-frame").checked;
      const targetElem = showFrame ? document.getElementById("shell-wrap") : document.getElementById("screen-viewport");

      html2canvas(targetElem, {
        scale: 3,
        useCORS: true,
        backgroundColor: showFrame ? null : '#F4F5F9',
        logging: false
      }).then(canvas => {
        const link = document.createElement('a');
        link.download = `Laya_Chat_Play_${Date.now()}.png`;
        link.href = canvas.toDataURL("image/png");
        link.click();
      }).catch(err => {
        alert("截屏生成失败：" + err.message);
      });
    }
  </script>
